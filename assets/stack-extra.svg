<svg width="380" height="60" viewBox="0 0 380 60" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, Menlo, Monaco, monospace">
  <filter id="chipGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <g filter="url(#chipGlow)">
    <rect x="10" y="9" width="200" height="42" rx="10" fill="#161B22" stroke="#FFC857" stroke-width="1.3">
      <animate attributeName="stroke" values="#FFC857;#F0F6FC;#FFC857" dur="3s" begin="0s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="110" y="35" fill="#FFC857" font-size="14" font-weight="bold" text-anchor="middle">JSON Schema</text>

  <g filter="url(#chipGlow)">
    <rect x="230" y="9" width="140" height="42" rx="10" fill="#161B22" stroke="#FFC857" stroke-width="1.3">
      <animate attributeName="stroke" values="#FFC857;#F0F6FC;#FFC857" dur="3s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="300" y="35" fill="#FFC857" font-size="14" font-weight="bold" text-anchor="middle">Math</text>
</svg>
