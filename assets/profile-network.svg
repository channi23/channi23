  <!-- traveling signals -->
  <circle r="5" fill="#00E5FF" filter="url(#sigGlow)">
    <animateMotion dur="5s" begin="0s" repeatCount="indefinite"><mpath href="#np1"/></animateMotion>
    <animate attributeName="fill" values="#00E5FF;#39FF14;#00E5FF" dur="5s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#FF00FF" filter="url(#sigGlow)">
