<svg width="1120" height="460" viewBox="0 0 1120 460" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, Menlo, Monaco, monospace">
  <defs>
    <linearGradient id="netBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39FF14">
        <animate attributeName="stop-color" values="#39FF14;#00E5FF;#FF00FF;#39FF14" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FF00FF">
        <animate attributeName="stop-color" values="#FF00FF;#39FF14;#00E5FF;#FF00FF" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="nodeGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter name="sig" id="sigGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <path id="np1" d="M130,235 L340,115 L560,235 L780,275 L980,235"/>
    <path id="np2" d="M130,235 L340,195 L560,315 L780,115 L980,235"/>
    <path id="np3" d="M130,235 L340,275 L560,155 L780,355 L980,235"/>
    <path id="np4" d="M130,235 L340,355 L560,235 L780,195 L980,235"/>
    <path id="np5" d="M130,235 L340,115 L560,315 L780,355 L980,235"/>
  </defs>

  <rect x="1" y="1" width="1118" height="458" rx="12" fill="#0D1117" stroke="url(#netBorder)" stroke-width="1.5"/>

  <text x="560" y="34" fill="#8B949E" font-size="13" text-anchor="middle">class Engineer(nn.Module): def forward(self): return shipped_system</text>

  <g fill="#8B949E" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="1">
    <text x="130" y="70">CORE</text>
    <text x="340" y="70">STACK</text>
    <text x="560" y="70">TRAITS</text>
    <text x="780" y="70">FOCUS</text>
    <text x="980" y="70">OUTPUT</text>
  </g>

  <!-- edges -->
