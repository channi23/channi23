    <g filter="url(#nodeGlow)"><rect x="505" y="218" width="110" height="34" rx="8" fill="#161B22" stroke="#FF00FF" stroke-width="1.3"><animate attributeName="stroke" values="#FF00FF;#F0F6FC;#FF00FF" dur="3s" begin="1.0s" repeatCount="indefinite"/></rect></g>
    <text x="560" y="239" fill="#FF00FF">Scalability</text>

    <g filter="url(#nodeGlow)"><rect x="505" y="298" width="110" height="34" rx="8" fill="#161B22" stroke="#FF00FF" stroke-width="1.3"><animate attributeName="stroke" values="#FF00FF;#F0F6FC;#FF00FF" dur="3s" begin="1.1s" repeatCount="indefinite"/></rect></g>
    <text x="560" y="319" fill="#FF00FF">Integrity</text>
