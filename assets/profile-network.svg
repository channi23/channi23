    <animate attributeName="fill" values="#39FF14;#FF00FF;#39FF14" dur="5s" begin="2s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#00E5FF" filter="url(#sigGlow)">
    <animateMotion dur="5s" begin="3s" repeatCount="indefinite"><mpath href="#np4"/></animateMotion>
    <animate attributeName="fill" values="#00E5FF;#39FF14;#00E5FF" dur="5s" begin="3s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#FF00FF" filter="url(#sigGlow)">
    <animateMotion dur="5s" begin="4s" repeatCount="indefinite"><mpath href="#np5"/></animateMotion>
    <animate attributeName="fill" values="#FF00FF;#00E5FF;#FF00FF" dur="5s" begin="4s" repeatCount="indefinite"/>
  </circle>

  <!-- CORE node -->
