    <g filter="url(#nodeGlow)"><rect x="705" y="178" width="150" height="34" rx="8" fill="#161B22" stroke="#39FF14" stroke-width="1.3"><animate attributeName="stroke" values="#39FF14;#F0F6FC;#39FF14" dur="3s" begin="1.5s" repeatCount="indefinite"/></rect></g>
    <text x="780" y="199" fill="#39FF14">Backend APIs</text>

    <g filter="url(#nodeGlow)"><rect x="705" y="258" width="150" height="34" rx="8" fill="#161B22" stroke="#39FF14" stroke-width="1.3"><animate attributeName="stroke" values="#39FF14;#F0F6FC;#39FF14" dur="3s" begin="1.6s" repeatCount="indefinite"/></rect></g>
    <text x="780" y="279" fill="#39FF14">Pipelines</text>

    <g filter="url(#nodeGlow)"><rect x="705" y="338" width="150" height="34" rx="8" fill="#161B22" stroke="#39FF14" stroke-width="1.3"><animate attributeName="stroke" values="#39FF14;#F0F6FC;#39FF14" dur="3s" begin="1.7s" repeatCount="indefinite"/></rect></g>
    <text x="780" y="359" fill="#39FF14">Automation</text>
