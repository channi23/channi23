    <line x1="130" y1="235" x2="340" y2="115"/>
    <line x1="130" y1="235" x2="340" y2="195"/>
    <line x1="130" y1="235" x2="340" y2="275"/>
    <line x1="130" y1="235" x2="340" y2="355"/>

    <line x1="340" y1="115" x2="560" y2="155"/>
