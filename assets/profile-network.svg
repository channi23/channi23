    <line x1="340" y1="355" x2="560" y2="315"/>

    <line x1="560" y1="155" x2="780" y2="115"/>
    <line x1="560" y1="155" x2="780" y2="195"/>
    <line x1="560" y1="155" x2="780" y2="275"/>
    <line x1="560" y1="155" x2="780" y2="355"/>
    <line x1="560" y1="235" x2="780" y2="115"/>
    <line x1="560" y1="235" x2="780" y2="195"/>
    <line x1="560" y1="235" x2="780" y2="275"/>
    <line x1="560" y1="235" x2="780" y2="355"/>
    <line x1="560" y1="315" x2="780" y2="115"/>
    <line x1="560" y1="315" x2="780" y2="195"/>
    <line x1="560" y1="315" x2="780" y2="275"/>
    <line x1="560" y1="315" x2="780" y2="355"/>

    <line x1="780" y1="115" x2="980" y2="235"/>
    <line x1="780" y1="195" x2="980" y2="235"/>
    <line x1="780" y1="275" x2="980" y2="235"/>
    <line x1="780" y1="355" x2="980" y2="235"/>
