    <g filter="url(#nodeGlow)"><rect x="705" y="98" width="150" height="34" rx="8" fill="#161B22" stroke="#39FF14" stroke-width="1.3"><animate attributeName="stroke" values="#39FF14;#F0F6FC;#39FF14" dur="3s" begin="1.4s" repeatCount="indefinite"/></rect></g>
