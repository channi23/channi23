  <text x="130" y="230" fill="#F0F6FC" font-size="13" font-weight="bold" text-anchor="middle">Sri Hari Haran Sharma</text>
  <text x="130" y="250" fill="#8B949E" font-size="11" text-anchor="middle">AI Systems Engineer</text>

