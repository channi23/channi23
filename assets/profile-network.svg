    <line x1="340" y1="115" x2="560" y2="315"/>
    <line x1="340" y1="195" x2="560" y2="155"/>
    <line x1="340" y1="195" x2="560" y2="235"/>
    <line x1="340" y1="195" x2="560" y2="315"/>
    <line x1="340" y1="275" x2="560" y2="155"/>
    <line x1="340" y1="275" x2="560" y2="235"/>
    <line x1="340" y1="275" x2="560" y2="315"/>
    <line x1="340" y1="355" x2="560" y2="155"/>
