<svg width="700" height="340" viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, Menlo, Monaco, monospace">
  <defs>
    <linearGradient id="idBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF">
        <animate attributeName="stop-color" values="#00E5FF;#FF00FF;#39FF14;#00E5FF" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#39FF14">
        <animate attributeName="stop-color" values="#39FF14;#00E5FF;#FF00FF;#39FF14" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="stampGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .tick { opacity: 0; animation: tick 8s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .t1 { animation-delay: 0.3s; }
    .t2 { animation-delay: 0.9s; }
    .t3 { animation-delay: 1.5s; }
    .t4 { animation-delay: 2.1s; }
    .t5 { animation-delay: 2.7s; }
    .t6 { animation-delay: 3.3s; }
    .t7 { animation-delay: 3.9s; }
    @keyframes tick {
      0%   { opacity: 0; transform: scale(0.3); }
      8%   { opacity: 1; transform: scale(1.3); }
      16%  { transform: scale(1); }
      88%  { opacity: 1; }
      100% { opacity: 0; }
    }
    .stamp { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
  </style>

  <rect x="1" y="1" width="698" height="338" rx="10" fill="#0D1117" stroke="url(#idBorder)" stroke-width="1.5"/>

  <rect x="1" y="1" width="698" height="34" rx="10" fill="#161B22"/>
  <rect x="1" y="24" width="698" height="11" fill="#161B22"/>
  <circle cx="24" cy="18" r="6" fill="#FF5F56"/>
  <circle cx="46" cy="18" r="6" fill="#FFBD2E"/>
  <circle cx="68" cy="18" r="6" fill="#27C93F"/>
  <text x="350" y="23" fill="#8B949E" font-size="13" text-anchor="middle">identity.schema.json</text>

  <g class="stamp" filter="url(#stampGlow)">
    <rect x="588" y="46" width="94" height="24" rx="12" fill="#0f2f16" stroke="#39FF14" stroke-width="1.2"/>
    <text x="635" y="62" fill="#39FF14" font-size="11" text-anchor="middle">✓ VALID</text>
  </g>

  <g font-size="15">
    <text x="26" y="94" fill="#8B949E">{</text>
    <text x="46" y="118" fill="#8B949E">"HariHaran": {</text>

    <text x="66" y="142" fill="#39FF14">"title": "AI Systems Engineer",</text>
    <text class="tick t1" x="640" y="142" fill="#39FF14" font-size="15">✓</text>

    <text x="66" y="166" fill="#00E5FF">"const": "Sri Hari Haran Sharma",</text>
    <text class="tick t2" x="640" y="166" fill="#39FF14" font-size="15">✓</text>

    <text x="66" y="190" fill="#FF00FF">"stack": ["Python", "TypeScript", "Rust", "Kotlin"],</text>
    <text class="tick t3" x="640" y="190" fill="#39FF14" font-size="15">✓</text>

    <text x="66" y="214" fill="#39FF14">"focus": ["ai/ml systems", "backend apis", "pipelines"],</text>
    <text class="tick t4" x="640" y="214" fill="#39FF14" font-size="15">✓</text>

    <text x="66" y="238" fill="#00E5FF">"traits": ["execution", "scalability", "integrity"],</text>
    <text class="tick t5" x="640" y="238" fill="#39FF14" font-size="15">✓</text>

    <text x="66" y="262" fill="#FF00FF">"status": "open_for_freelance",</text>
    <text class="tick t6" x="640" y="262" fill="#39FF14" font-size="15">✓</text>

    <text x="66" y="286" fill="#39FF14">"$ref": "#/core/system-architect"</text>
    <text class="tick t7" x="640" y="286" fill="#39FF14" font-size="15">✓</text>

    <text x="46" y="310" fill="#8B949E">}</text>
    <text x="26" y="326" fill="#8B949E">}</text>
  </g>
</svg>
