<svg width="800" height="220" viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, Menlo, Monaco, monospace">
  <defs>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="track" d="M140,110 L320,110 L500,110 L680,110"/>
  </defs>

  <rect x="0" y="0" width="800" height="220" fill="#0D1117"/>

  <path d="M140,110 L320,110 L500,110 L680,110" stroke="#30363d" stroke-width="2" stroke-dasharray="6 6" fill="none"/>

  <circle r="7" fill="#39FF14" filter="url(#glow)">
    <animateMotion dur="6s" repeatCount="indefinite" rotate="auto">
      <mpath href="#track"/>
    </animateMotion>
    <animate attributeName="fill" values="#39FF14;#00E5FF;#FF00FF;#39FF14" dur="6s" repeatCount="indefinite"/>
  </circle>

  <g>
    <rect x="80" y="80" width="120" height="60" rx="8" fill="#161B22" stroke="#30363d" stroke-width="2">
      <animate attributeName="stroke" values="#30363d;#39FF14;#30363d" keyTimes="0;0.05;1" dur="6s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <text x="140" y="112" fill="#F0F6FC" font-size="15" text-anchor="middle">DATA</text>
    <text x="140" y="130" fill="#8B949E" font-size="10" text-anchor="middle">collect · clean</text>
  </g>

  <g>
    <rect x="260" y="80" width="120" height="60" rx="8" fill="#161B22" stroke="#30363d" stroke-width="2">
      <animate attributeName="stroke" values="#30363d;#00E5FF;#30363d" keyTimes="0;0.05;1" dur="6s" begin="2s" repeatCount="indefinite"/>
    </rect>
    <text x="320" y="112" fill="#F0F6FC" font-size="15" text-anchor="middle">TRAIN</text>
    <text x="320" y="130" fill="#8B949E" font-size="10" text-anchor="middle">fit · tune</text>
  </g>

  <g>
    <rect x="440" y="80" width="120" height="60" rx="8" fill="#161B22" stroke="#30363d" stroke-width="2">
      <animate attributeName="stroke" values="#30363d;#FF00FF;#30363d" keyTimes="0;0.05;1" dur="6s" begin="4s" repeatCount="indefinite"/>
    </rect>
    <text x="500" y="112" fill="#F0F6FC" font-size="15" text-anchor="middle">EVAL</text>
    <text x="500" y="130" fill="#8B949E" font-size="10" text-anchor="middle">test · score</text>
  </g>

  <g>
    <rect x="620" y="80" width="120" height="60" rx="8" fill="#161B22" stroke="#30363d" stroke-width="2">
      <animate attributeName="stroke" values="#30363d;#39FF14;#30363d" keyTimes="0;0.05;1" dur="6s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <text x="680" y="112" fill="#F0F6FC" font-size="15" text-anchor="middle">DEPLOY</text>
    <text x="680" y="130" fill="#8B949E" font-size="10" text-anchor="middle">ship · monitor</text>
  </g>

  <text x="400" y="185" fill="#8B949E" font-size="13" text-anchor="middle">idea -&gt; shipped system</text>
</svg>
