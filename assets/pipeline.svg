<svg width="800" height="220" viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, Menlo, Monaco, monospace">
  <defs>
    <filter id="nglow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <path id="p1" d="M100,60 L280,110 L480,75 L660,85"/>
    <path id="p2" d="M100,110 L280,40 L480,145 L660,135"/>
    <path id="p3" d="M100,160 L280,180 L480,110 L660,85"/>
    <path id="p4" d="M100,60 L280,75 L480,180 L660,135"/>
    <path id="p5" d="M100,110 L280,145 L480,40 L660,85"/>
  </defs>

  <style>
    .pulse { animation: fire 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .n0 { animation-delay: 0s; }
    .n1 { animation-delay: 0.3s; }
    .n2 { animation-delay: 0.6s; }
    .n3 { animation-delay: 0.9s; }
    @keyframes fire {
      0%, 100% { opacity: 0.55; r: 6; }
      50% { opacity: 1; r: 8; }
    }
  </style>

  <rect x="0" y="0" width="800" height="220" fill="#0D1117"/>

  <g stroke="#30363d" stroke-width="1" opacity="0.35">
    <line x1="100" y1="60" x2="280" y2="40"/>
    <line x1="100" y1="60" x2="280" y2="75"/>
    <line x1="100" y1="60" x2="280" y2="110"/>
    <line x1="100" y1="60" x2="280" y2="145"/>
    <line x1="100" y1="60" x2="280" y2="180"/>
    <line x1="100" y1="110" x2="280" y2="40"/>
    <line x1="100" y1="110" x2="280" y2="75"/>
    <line x1="100" y1="110" x2="280" y2="110"/>
    <line x1="100" y1="110" x2="280" y2="145"/>
    <line x1="100" y1="110" x2="280" y2="180"/>
    <line x1="100" y1="160" x2="280" y2="40"/>
    <line x1="100" y1="160" x2="280" y2="75"/>
    <line x1="100" y1="160" x2="280" y2="110"/>
    <line x1="100" y1="160" x2="280" y2="145"/>
    <line x1="100" y1="160" x2="280" y2="180"/>

    <line x1="280" y1="40" x2="480" y2="40"/>
    <line x1="280" y1="40" x2="480" y2="75"/>
    <line x1="280" y1="40" x2="480" y2="110"/>
    <line x1="280" y1="75" x2="480" y2="75"/>
    <line x1="280" y1="75" x2="480" y2="110"/>
    <line x1="280" y1="75" x2="480" y2="145"/>
    <line x1="280" y1="110" x2="480" y2="40"/>
    <line x1="280" y1="110" x2="480" y2="110"/>
    <line x1="280" y1="110" x2="480" y2="180"/>
    <line x1="280" y1="145" x2="480" y2="75"/>
    <line x1="280" y1="145" x2="480" y2="145"/>
    <line x1="280" y1="145" x2="480" y2="180"/>
    <line x1="280" y1="180" x2="480" y2="110"/>
    <line x1="280" y1="180" x2="480" y2="145"/>
    <line x1="280" y1="180" x2="480" y2="180"/>

    <line x1="480" y1="40" x2="660" y2="85"/>
    <line x1="480" y1="75" x2="660" y2="85"/>
    <line x1="480" y1="110" x2="660" y2="85"/>
    <line x1="480" y1="145" x2="660" y2="135"/>
    <line x1="480" y1="180" x2="660" y2="135"/>
    <line x1="480" y1="110" x2="660" y2="135"/>
  </g>

  <circle class="pulse n0" r="7" fill="#00E5FF" filter="url(#nglow)">
    <animateMotion dur="4s" begin="0s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion>
    <animate attributeName="fill" values="#00E5FF;#39FF14;#00E5FF" dur="4s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle class="pulse n1" r="7" fill="#FF00FF" filter="url(#nglow)">
    <animateMotion dur="4s" begin="0.8s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion>
    <animate attributeName="fill" values="#FF00FF;#00E5FF;#FF00FF" dur="4s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
  <circle class="pulse n2" r="7" fill="#39FF14" filter="url(#nglow)">
    <animateMotion dur="4s" begin="1.6s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion>
    <animate attributeName="fill" values="#39FF14;#FF00FF;#39FF14" dur="4s" begin="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle class="pulse n3" r="7" fill="#00E5FF" filter="url(#nglow)">
    <animateMotion dur="4s" begin="2.4s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion>
    <animate attributeName="fill" values="#00E5FF;#39FF14;#00E5FF" dur="4s" begin="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle class="pulse" r="7" fill="#FF00FF" filter="url(#nglow)">
    <animateMotion dur="4s" begin="3.2s" repeatCount="indefinite"><mpath href="#p5"/></animateMotion>
    <animate attributeName="fill" values="#FF00FF;#00E5FF;#FF00FF" dur="4s" begin="3.2s" repeatCount="indefinite"/>
  </circle>

  <g fill="#8B949E" font-size="10" text-anchor="middle">
    <text x="100" y="205">INTAKE</text>
    <text x="280" y="205">UNDERSTAND</text>
    <text x="480" y="205">REFINE</text>
    <text x="660" y="205">SHIP</text>
  </g>

  <g fill="#161B22" stroke="#39FF14" stroke-width="1.5">
    <circle cx="100" cy="60" r="6"/><circle cx="100" cy="110" r="6"/><circle cx="100" cy="160" r="6"/>
  </g>
  <g fill="#161B22" stroke="#00E5FF" stroke-width="1.5">
    <circle cx="280" cy="40" r="6"/><circle cx="280" cy="75" r="6"/><circle cx="280" cy="110" r="6"/><circle cx="280" cy="145" r="6"/><circle cx="280" cy="180" r="6"/>
  </g>
  <g fill="#161B22" stroke="#FF00FF" stroke-width="1.5">
    <circle cx="480" cy="40" r="6"/><circle cx="480" cy="75" r="6"/><circle cx="480" cy="110" r="6"/><circle cx="480" cy="145" r="6"/><circle cx="480" cy="180" r="6"/>
  </g>
  <g fill="#161B22" stroke="#39FF14" stroke-width="1.5">
    <circle cx="660" cy="85" r="6"/><circle cx="660" cy="135" r="6"/>
  </g>

  <text x="400" y="20" fill="#8B949E" font-size="13" text-anchor="middle">intake -&gt; understand -&gt; refine -&gt; ship</text>
</svg>
