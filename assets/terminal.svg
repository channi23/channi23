<svg width="700" height="480" viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, Menlo, Monaco, monospace">
  <defs>
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39FF14">
        <animate attributeName="stop-color" values="#39FF14;#00E5FF;#FF00FF;#39FF14" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FF00FF">
        <animate attributeName="stop-color" values="#FF00FF;#39FF14;#00E5FF;#FF00FF" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="stampGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .line { animation: reveal 14s ease-in-out infinite; }
    .l1  { animation-delay: 0.0s; }
    .l2  { animation-delay: 1.0s; }
    .l3  { animation-delay: 1.8s; }
    .l4  { animation-delay: 2.6s; }
    .l5  { animation-delay: 3.6s; }
    .l6  { animation-delay: 4.3s; }
    .l7  { animation-delay: 4.6s; }
    .l8  { animation-delay: 4.9s; }
    .l9  { animation-delay: 5.2s; }
    .l10 { animation-delay: 5.5s; }
    .l11 { animation-delay: 5.8s; }
    .l12 { animation-delay: 6.1s; }
    .l13 { animation-delay: 6.4s; }
    .l14 { animation-delay: 6.7s; }
    .l15 { animation-delay: 7.0s; }
    .l16 { animation-delay: 7.2s; }
    @keyframes reveal {
      0%   { clip-path: inset(0 100% 0 0); }
      15%  { clip-path: inset(0 0 0 0); }
      90%  { clip-path: inset(0 0 0 0); }
      100% { clip-path: inset(0 100% 0 0); }
    }

    .tick { opacity: 0; animation: tick 14s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .t1 { animation-delay: 5.5s; }
    .t2 { animation-delay: 5.8s; }
    .t3 { animation-delay: 6.1s; }
    .t4 { animation-delay: 6.4s; }
    .t5 { animation-delay: 6.7s; }
    .t6 { animation-delay: 7.0s; }
    .t7 { animation-delay: 7.3s; }
    @keyframes tick {
      0%   { opacity: 0; transform: scale(0.3); }
      6%   { opacity: 1; transform: scale(1.3); }
      12%  { transform: scale(1); }
      86%  { opacity: 1; }
      100% { opacity: 0; }
    }

    .stamp { opacity: 0; animation: stamp 14s ease-in-out infinite; animation-delay: 7.6s; }
    @keyframes stamp {
      0%   { opacity: 0; transform: scale(0.5); }
      6%   { opacity: 1; transform: scale(1.15); }
      12%  { transform: scale(1); }
      82%  { opacity: 1; }
      100% { opacity: 0; }
    }

    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  </style>

  <rect x="1" y="1" width="698" height="478" rx="10" fill="#0D1117" stroke="url(#borderGlow)" stroke-width="1.5"/>

  <rect x="1" y="1" width="698" height="34" rx="10" fill="#161B22"/>
  <rect x="1" y="24" width="698" height="11" fill="#161B22"/>
  <circle cx="24" cy="18" r="6" fill="#FF5F56"/>
  <circle cx="46" cy="18" r="6" fill="#FFBD2E"/>
  <circle cx="68" cy="18" r="6" fill="#27C93F"/>
  <text x="350" y="23" fill="#8B949E" font-size="13" text-anchor="middle">sri@channi23: ~</text>

  <g class="stamp" filter="url(#stampGlow)" transform-origin="635px 58px">
    <rect x="588" y="46" width="94" height="24" rx="12" fill="#0f2f16" stroke="#39FF14" stroke-width="1.2"/>
    <text x="635" y="62" fill="#39FF14" font-size="11" text-anchor="middle">✓ VALID</text>
  </g>

  <text class="line l1" x="26" y="72" fill="#39FF14" font-size="16">$ hariharan --code --build --ship</text>
  <text class="line l2" x="26" y="96" fill="#00E5FF" font-size="16">&gt; engineer.init() -- ai systems, backend, pipelines</text>
  <text class="line l3" x="26" y="120" fill="#FF00FF" font-size="16">&gt; uptime: always shipping</text>
  <text class="line l4" x="26" y="144" fill="#F0F6FC" font-size="16">&gt; status: open for freelance work</text>

  <text class="line l5" x="26" y="180" fill="#39FF14" font-size="16">$ cat identity.schema.json</text>

  <g font-size="15">
    <text class="line l6" x="26" y="204" fill="#8B949E">{</text>
    <text class="line l7" x="46" y="228" fill="#8B949E">"HariHaran": {</text>

    <text class="line l8" x="66" y="252" fill="#39FF14">"title": "AI Systems Engineer",</text>
    <text class="tick t1" x="640" y="252" fill="#39FF14" font-size="15">✓</text>

    <text class="line l9" x="66" y="276" fill="#00E5FF">"const": "Sri Hari Haran Sharma",</text>
    <text class="tick t2" x="640" y="276" fill="#39FF14" font-size="15">✓</text>

    <text class="line l10" x="66" y="300" fill="#FF00FF">"stack": ["Python", "TypeScript", "Rust", "Kotlin"],</text>
    <text class="tick t3" x="640" y="300" fill="#39FF14" font-size="15">✓</text>

    <text class="line l11" x="66" y="324" fill="#39FF14">"focus": ["ai/ml systems", "backend apis", "pipelines"],</text>
    <text class="tick t4" x="640" y="324" fill="#39FF14" font-size="15">✓</text>

    <text class="line l12" x="66" y="348" fill="#00E5FF">"traits": ["execution", "scalability", "integrity"],</text>
    <text class="tick t5" x="640" y="348" fill="#39FF14" font-size="15">✓</text>

    <text class="line l13" x="66" y="372" fill="#FF00FF">"status": "open_for_freelance",</text>
    <text class="tick t6" x="640" y="372" fill="#39FF14" font-size="15">✓</text>

    <text class="line l14" x="66" y="396" fill="#39FF14">"$ref": "#/core/system-architect"</text>
    <text class="tick t7" x="640" y="396" fill="#39FF14" font-size="15">✓</text>

    <text class="line l15" x="46" y="420" fill="#8B949E">}</text>
    <text class="line l16" x="26" y="444" fill="#8B949E">}</text>
  </g>

  <rect class="cursor" x="26" y="456" width="10" height="18" fill="#39FF14"/>
</svg>
